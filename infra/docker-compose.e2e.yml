# Production-like stack for end-to-end tests: the real images (Caddy + API + Postgres), disposable
# data. Run: docker compose -f infra/docker-compose.e2e.yml up -d --build --wait
name: gym-e2e
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gym -d gym_e2e']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: gym-api:e2e
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    command: ['node', 'dist/migrate.mjs']
    environment: &api-env
      DATABASE_URL: postgres://gym:gym@postgres:5432/gym_e2e
      BETTER_AUTH_SECRET: e2e-secret-e2e-secret-e2e-secret-012345
      BETTER_AUTH_URL: http://localhost:8088
      NODE_ENV: production
      LOG_LEVEL: warn
      # Tests sign up many users from one IP; rate limiting is verified separately.
      AUTH_RATE_LIMIT: 'off'
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: 'Gym <no-reply@test.local>'
      # Test-only VAPID keys for this local stack (never used in production).
      VAPID_PUBLIC_KEY: BM-HQRzVUhOt1b7x_jKSl26HJALynvwmrWZpoTH9Bd_tKInYQdbR2I8dmClUXLB8SNWNBCgP-hJqxmkmzjhyOiw
      VAPID_PRIVATE_KEY: Fb_8vOYBZxWjT8ePRAjnw13JDpk4jMkqb6Wt7GJtAvg
      VAPID_SUBJECT: mailto:e2e@test.local
      # Test-only master key and a fake Claude API (see infra/fake-ai).
      APP_ENCRYPTION_KEY: dGVzdC1tYXN0ZXIta2V5LTMyLWJ5dGVzLWxvbmctMDE=
      AI_BASE_URL: http://fake-ai:4010
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: gym-api:e2e
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    image: gym-api:e2e
    command: ['node', 'dist/worker.mjs']
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  fake-ai:
    image: node:24.22.2-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    command: ['node', '/srv/server.mjs']
    volumes:
      - ./fake-ai/server.mjs:/srv/server.mjs:ro
    ports:
      - '54010:4010'

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '58026:8025'

  web:
    image: gym-web:e2e
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_UPSTREAM: api:3000
    ports:
      - '8088:8080'
    depends_on:
      api: { condition: service_healthy }
