# Applies database migrations for a new version. Constitution: a backup is taken before every
# migration; if the backup fails, the migration does not run.
# Jobs are immutable: delete the previous one before applying a new version (see deploy/README.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: gym-migrate
  namespace: gym
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: gym-registry
      initContainers:
        - name: pre-migration-backup
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          command: ["sh", "/scripts/backup.sh"]
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: gym }
            - { name: PGDATABASE, value: gym }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: gym-secrets, key: POSTGRES_PASSWORD } }
            - { name: BACKUP_DIR, value: /backups }
            - { name: PREFIX, value: gym-premigrate }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: backups, mountPath: /backups }
            - { name: scripts, mountPath: /scripts, readOnly: true }
      containers:
        - name: migrate
          # Same image as deployment/gym-api (pin the same version@sha256).
          image: registry.example.com/owner/gym-api:0.4.1@sha256:f6f4c306c99f278eef8819f51518e76cc03c797fc7ac28bce96d483779a4e4ff
          command: ["node", "dist/migrate.mjs"]
          envFrom: [{ secretRef: { name: gym-secrets } }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: backups
          persistentVolumeClaim: { claimName: gym-backups }
        - name: scripts
          configMap: { name: gym-backup-scripts }
