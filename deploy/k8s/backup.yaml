# Automatic backups: a daily dump kept 30 days (at least the newest 7) on the gym-backups volume
# (backups-pvc.yaml), and a monthly restore test into a scratch database. Scripts:
# backup-scripts.yaml (generated from deploy/backup/*.sh).
# Run one now:  kubectl -n gym create job --from=cronjob/gym-backup backup-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gym-backup
  namespace: gym
spec:
  schedule: "30 3 * * *"
  timeZone: America/Santiago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
              command: ["sh", "/scripts/backup.sh"]
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: gym }
                - { name: PGDATABASE, value: gym }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: gym-secrets, key: POSTGRES_PASSWORD } }
                - { name: BACKUP_DIR, value: /backups }
                - { name: KEEP_DAYS, value: "30" }
                - { name: KEEP_MIN, value: "7" }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: gym-backups }
            - name: scripts
              configMap: { name: gym-backup-scripts }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gym-backup-verify
  namespace: gym
spec:
  schedule: "0 5 1 * *"
  timeZone: America/Santiago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: verify
              image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
              command: ["sh", "/scripts/verify.sh"]
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: gym }
                - { name: PGDATABASE, value: gym }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: gym-secrets, key: POSTGRES_PASSWORD } }
                - { name: BACKUP_DIR, value: /backups }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: gym-backups }
            - name: scripts
              configMap: { name: gym-backup-scripts }
