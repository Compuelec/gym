# PostgreSQL for Gym (single instance, data on a Longhorn PersistentVolumeClaim).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gym
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432, name: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gym
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      # Time to finish writes and shut down cleanly before being killed.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          # Pinned (17.11, same image as Al Día): a moving tag must not upgrade the database.
          image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - { name: POSTGRES_USER, value: gym }
            - { name: POSTGRES_DB, value: gym }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: gym-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "gym", "-d", "gym"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "gym", "-d", "gym"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 10Gi }
