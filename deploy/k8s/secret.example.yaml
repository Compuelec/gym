# EXAMPLE ONLY — never apply this file or commit real values.
# Create the real secret with kubectl (see deploy/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: gym-secrets
  namespace: gym
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<openssl rand -base64 24>"
  DATABASE_URL: "postgres://gym:<POSTGRES_PASSWORD>@postgres:5432/gym"
  BETTER_AUTH_SECRET: "<openssl rand -base64 32>"
  BETTER_AUTH_URL: "https://gym.example.com"
  APP_ENCRYPTION_KEY: "<openssl rand -base64 32>"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  SMTP_URL: ""
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  ADMIN_EMAIL: ""
